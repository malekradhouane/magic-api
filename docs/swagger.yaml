host: localhost:5001
info:
  contact:
    email: malek.radhouen@gmail.com
    name: API Support
    url: https://www.magic.fr/support
  description: Here is our solution documentation and testing portal of provided functionalities
    to interact with our hypervisor tool.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://www.magic.com/terms/
  title: Magic - Inventory solution API
  version: "1.0"
paths:
  /activate/{token}:
    get:
      consumes:
      - application/json
      description: Activates a user account using the validation token from email
      operationId: activate-account
      parameters:
      - description: Activation token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account activated successfully
          schema:
            $ref: '#/definitions/httpresp.JSONResult'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/httpresp.HTTPError'
      summary: Activate user account
      tags:
      - authenticate
  /admin/orders:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.OrdersResponse'
      summary: List all orders (admin)
      tags:
      - orders
  /admin/orders/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/api.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/interfaces.Order'
      summary: Update order status
      tags:
      - orders
  /admin/promos:
    get:
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
