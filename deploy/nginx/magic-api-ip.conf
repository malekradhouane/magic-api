# ============================================================================
# Nginx — Phase IP (HTTP simple, SANS domaine, SANS TLS)
# ----------------------------------------------------------------------------
# Optionnel : permet d'accéder à l'API via  http://<IP>/  (port 80) au lieu de
# http://<IP>:5002. Pratique mais PAS obligatoire pour juste tester.
#
# Place sur le VPS : /etc/nginx/sites-available/magic-api-ip.conf
#   sudo ln -s /etc/nginx/sites-available/magic-api-ip.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Temporaire. Quand le domaine arrive, repasse sur magic-api.conf (HTTPS).
# ============================================================================

server {
    listen 80 default_server;
    server_name _;          # répond à n'importe quel host (donc à l'IP nue)

    server_tokens off;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
