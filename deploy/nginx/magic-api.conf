# ============================================================================
# Nginx reverse proxy for magic-api  (host: api.votredomaine.tn)
# ----------------------------------------------------------------------------
# Place on the VPS at: /etc/nginx/sites-available/magic-api.conf
# then: ln -s /etc/nginx/sites-available/magic-api.conf /etc/nginx/sites-enabled/
#
# TLS is terminated here (certbot) AND by Cloudflare ("Full (strict)" mode).
# Replace api.votredomaine.tn with your real API subdomain everywhere below.
# ============================================================================

# Restore the real visitor IP from Cloudflare (so logs/rate-limits are correct).
# IP lists: https://www.cloudflare.com/ips/  (update if Cloudflare changes them)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Basic rate limiting (defense-in-depth, on top of Cloudflare).
# 20 req/s per IP with a burst; tune to your traffic.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name api.votredomaine.tn;

    # Let certbot validate, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.votredomaine.tn;

    # certbot fills these in (certbot --nginx) — paths shown for reference.
    ssl_certificate     /etc/letsencrypt/live/api.votredomaine.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.votredomaine.tn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reasonable upload size for product images proxied through the API.
    client_max_body_size 25m;

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }
}
