# ============================================================================
# MAGIC — Production stack (VPS)
# ----------------------------------------------------------------------------
# Runs ONLY the backend API + PostgreSQL on the server.
# The two front-ends (magic-front, magic-admin) are deployed separately as
# static sites on Cloudflare Pages — they are NOT in this file.
#
# Security model:
#   - PostgreSQL is NEVER exposed to the internet (no host port mapping).
#     It lives on the internal Docker network and is reachable only by the API.
#   - The API is exposed to localhost only (127.0.0.1:5002) and sits behind
#     Nginx + Cloudflare. It is never hit directly from the internet.
#
# Usage:
#   cp .env.prod.example .env.prod   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: magic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO "ports:" section on purpose — DB stays internal to the Docker network.
    networks:
      - magic-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  magic-api:
    image: ghcr.io/magic-tn/magic-api:latest
    # Or build locally instead of pulling a registry image:
    # build:
    #   context: ../magic-api
    #   dockerfile: Dockerfile
    container_name: magic-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODE: prod
      ENV: production

      # --- Database (internal hostname = service name "postgres", port 5432) ---
      STORAGES_POSTGRESQL_HOST: postgres
      STORAGES_POSTGRESQL_PORT: 5432
      STORAGES_POSTGRESQL_MAGICDB: ${POSTGRES_DB}
      STORAGES_POSTGRESQL_MAGICLOGIN: ${POSTGRES_USER}
      STORAGES_POSTGRESQL_MAGICPASS: ${POSTGRES_PASSWORD}
      # storeinit / alternate driver naming (kept in sync with dev .env)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_LOGIN: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAGIC_PG_SSLMODE: disable

      # --- Auth / sessions ---
      MAGIC_CUSTOMER_SECRET: ${MAGIC_CUSTOMER_SECRET}
      GOTH_SESSION_KEY: ${GOTH_SESSION_KEY}

      # --- Google OAuth ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # --- URLs / CORS ---
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # --- Object storage (Cloudflare R2) ---
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      # The API also accepts the generic S3_* names; keep them aligned.
      S3_BUCKET: ${R2_BUCKET}
      S3_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}

      # --- Email (Mailjet) ---
      MAILJET_API_KEY_PUBLIC: ${MAILJET_API_KEY_PUBLIC}
      MAILJET_API_KEY_PRIVATE: ${MAILJET_API_KEY_PRIVATE}
      MAILJET_FROM_NAME: ${MAILJET_FROM_NAME}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL}
    # Bind to localhost only: Nginx (on the host) proxies to this port.
    ports:
      - "127.0.0.1:5002:5002"
    networks:
      - magic-internal

networks:
  magic-internal:
    driver: bridge

volumes:
  postgres_data:
