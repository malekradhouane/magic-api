# ============================================================================
# MAGIC — Phase IP (test, SANS domaine, SANS HTTPS)
# ----------------------------------------------------------------------------
# But : valider rapidement la stack complète sur le VPS :
#   - API + PostgreSQL  →  http://<IP>:5002
#   - Boutique (front)  →  http://<IP>:8080
#   - Admin             →  http://<IP>:8081
#
# ⚠️ À NE PAS utiliser pour ouvrir la boutique au public :
#    - pas de HTTPS (trafic en clair)
#    - services exposés directement (pas de Cloudflare devant)
#    Quand tu auras le domaine, repasse sur docker-compose.prod.yml (+ Pages).
#
# Usage :
#   cp .env.ip.example .env.ip   # puis remplir (remplacer <IP> partout)
#   docker compose -f docker-compose.ip.yml --env-file .env.ip up -d --build
# ============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: magic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Toujours interne : la DB n'est jamais exposée, même en phase test.
    networks:
      - magic-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  magic-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: magic-api:local
    container_name: magic-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODE: prod
      ENV: production

      STORAGES_POSTGRESQL_HOST: postgres
      STORAGES_POSTGRESQL_PORT: 5432
      STORAGES_POSTGRESQL_MAGICDB: ${POSTGRES_DB}
      STORAGES_POSTGRESQL_MAGICLOGIN: ${POSTGRES_USER}
      STORAGES_POSTGRESQL_MAGICPASS: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_LOGIN: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MAGIC_PG_SSLMODE: disable

      MAGIC_CUSTOMER_SECRET: ${MAGIC_CUSTOMER_SECRET}
      GOTH_SESSION_KEY: ${GOTH_SESSION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # En phase IP : http://<IP>  (pas de https, pas de domaine)
      BASE_URL: ${BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      S3_BUCKET: ${R2_BUCKET}
      S3_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}

      MAILJET_API_KEY_PUBLIC: ${MAILJET_API_KEY_PUBLIC}
      MAILJET_API_KEY_PRIVATE: ${MAILJET_API_KEY_PRIVATE}
      MAILJET_FROM_NAME: ${MAILJET_FROM_NAME}
      MAILJET_FROM_EMAIL: ${MAILJET_FROM_EMAIL}
    # Phase IP : on expose l'API sur toutes les interfaces pour y accéder
    # via http://<IP>:5002 depuis ton PC / Netlify (test uniquement).
    ports:
      - "5002:5002"
    networks:
      - magic-internal

  magic-front:
    build:
      context: ../../magic-front
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
        NUXT_PUBLIC_R2_BASE_URL: ${R2_PUBLIC_BASE_URL}
    image: magic-front:local
    container_name: magic-front
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/magic-front-ip.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - magic-internal

  magic-admin:
    build:
      context: ../../magic-admin
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
        NUXT_PUBLIC_R2_BASE_URL: ${R2_PUBLIC_BASE_URL}
        NUXT_IMAGE_PROVIDER: ${NUXT_IMAGE_PROVIDER:-ipx}
    image: magic-admin:local
    container_name: magic-admin
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL}
      - NUXT_PUBLIC_R2_BASE_URL=${R2_PUBLIC_BASE_URL}
    networks:
      - magic-internal

networks:
  magic-internal:
    driver: bridge

volumes:
  postgres_data:
