version: '3.8'

services:
  magic-api:
    image: ghcr.io/magic-tn/magic-api:latest
    container_name: magic-api
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - MODE=${MODE:-dev}
      - STORAGES_POSTGRESQL_HOST=postgres
      - STORAGES_POSTGRESQL_PORT=5432
      - STORAGES_POSTGRESQL_MAGICDB=${POSTGRES_DB:-magicdb}
      - STORAGES_POSTGRESQL_MAGICLOGIN=${POSTGRES_USER:-admin}
      - STORAGES_POSTGRESQL_MAGICPASS=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - magic-network

  postgres:
    image: postgres:15-alpine
    container_name: magic-api-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-magicdb}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - magic-network

  # MinIO: local S3-compatible object storage used in dev to mimic
  # Cloudflare R2. In prod, set S3_ENDPOINT to the R2 endpoint.
  minio:
    image: minio/minio:latest
    container_name: magic-api-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Allow browser PUTs from the admin/front dev servers.
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_CORS_ORIGIN:-*}
    ports:
      - "9100:9000"   # S3 API (host:container)
      - "9101:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      # Runs inside the container, so target the container port (9000).
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - magic-network

  # One-shot job that creates the bucket and makes it publicly readable
  # so that <nuxt-img> can fetch objects directly from MinIO in dev.
  minio-init:
    image: minio/mc:latest
    container_name: magic-api-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/magic-products &&
      mc anonymous set download local/magic-products
      "
    networks:
      - magic-network

networks:
  magic-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
