services:
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh
    environment:
      - POSTGRES_PASSWORD=pgdba
      # - POSTGRES_USER=admin
      # - POSTGRES_DB=magic-api
      - MAGIC_USER=magic-api
      - MAGIC_PASS=admin
      - MAGIC_DB=magicdb


networks:
  magic-compose-network:
    driver: bridge

volumes:
  mongodb:
  mongodb_express:
  postgres:
