mode: prod # operational mode for magic-api. E.G : "prod", "dev", "test", etc.

startup:

  # Command to run, in order, at early stage of the startup.
  # Commonly used to check, initialize or update infrastructure before start.
  execPre:
    - name: storeinit
      desc: "Check and update storage schemas"
      disabled: false
      continueOnFailure: false
      workDir:
      command: "./bin/storeinit"
      args: ["--up"]
      env:
        - STOREINIT_CONFIG=config/config.yaml

storages:
  postgresql:
    host: "127.0.0.1"
    port: 5435
    accessControl: true
    # db name, user and password must be existing ones. If they are incorrect, Magic won't create them.
    # the below example works by default for new environments (docker or kube correctly initialized)
    magicDB: "magicdb"
    magicLogin: ""
    magicPass: ""



email:
  mailjet:
    api_key_public: "" # Set via MAGIC_EMAIL_MAILJET_API_KEY_PUBLIC env var
    api_key_private: "" # Set via MAILJET_API_KEY_PRIVATE env var
    from_name: "Magic"
    from_email: "noreply@magic.fr" # override via MAILJET_FROM_EMAIL

httpserver:
  port: 5002
  tls: false
  jwtSecret:

base_url: "http://localhost:5002"

# S3-compatible object storage (Cloudflare R2 in prod, MinIO in local dev).
# All values can be overridden via env vars. Both S3_* and R2_* are accepted.
#
#   Local (MinIO, see docker-compose.yml — host ports 9100/9101):
#     S3_ENDPOINT=http://localhost:9100
#     S3_BUCKET=magic-products
#     S3_ACCESS_KEY_ID=minioadmin
#     S3_SECRET_ACCESS_KEY=minioadmin
#     S3_PUBLIC_BASE_URL=http://localhost:9100/magic-products
#     # MinIO web console: http://localhost:9101
#
#   Prod (Cloudflare R2):
#     R2_ACCOUNT_ID=...                   # endpoint auto-derived
#     R2_BUCKET=magic-products
#     R2_ACCESS_KEY_ID=...
#     R2_SECRET_ACCESS_KEY=...
#     R2_PUBLIC_BASE_URL=https://cdn.example.com
r2:
  endpoint: "" # e.g. http://localhost:9000 for MinIO; leave empty to use account_id (R2)
  region: "auto"
  account_id: ""
  bucket: ""
  access_key_id: ""
  secret_access_key: ""
  public_base_url: ""
  presign_ttl_seconds: 900

logging:
  level: error
  formatter: json # either 'text' or 'json'
  verbose: false # if true, log with more fields and caller

